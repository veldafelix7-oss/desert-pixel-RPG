name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: ["arena/f860112b-desert-pixel-rpg", "main"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if ! "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0' > /tmp/sdk-setup.log 2>&1; then
            tail -60 /tmp/sdk-setup.log
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -8 /tmp/sdk-setup.log)
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build and verify debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon > /tmp/android-build.log 2>&1; then
            tail -100 /tmp/android-build.log
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -25 /tmp/android-build.log)
            exit 1
          fi
          tail -25 /tmp/android-build.log
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/desert-pixel-rpg-0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: desert-pixel-rpg-debug
          path: android/app/build/outputs/apk/debug/desert-pixel-rpg-0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish requested preview release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[preview-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-preview.${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/desert-pixel-rpg-0.1.0-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Desert Pixel RPG 0.1.0 — Prototype Android" \
            --prerelease \
            --notes-file docs/RELEASE-NOTES.md
